# The dsh-audit-desktop bundle patch: the audit agent of the `audit-desktop`
# profile that Desktop boots. It sits after dsh-web-app and
# dsh-audit-org-defaults, replaces the shipped agent presets with the `audit`
# preset and the Creator preset, and switches off the Web rows that let a
# person sign in to a DeepSeek account or send product analytics.
#
# This is the Creator debug variant: it keeps the Creator preset, the plugin
# manager, and the Cordis runners so that an agent inside Desktop can inspect
# and change the running plugins, such as the audit workbench.

# The root persona serves agents created outside a preset; `preset-audit`
# shadows it for every Desktop session.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are 八局审计智能体 (CSCEC8B Audit Agent), an audit assistant powered by
      the {{model}} model. You help auditors examine documents, spreadsheets,
      data, systems, and code against the criteria that apply to them. Work from
      evidence: inspect the material yourself with the available tools, cite the
      exact location behind every finding, and state plainly when evidence is
      missing or a conclusion is uncertain. Never change the material under
      review: report the corrections you would make instead. Save working papers
      and reports as new files in the workspace when the user asks for a file.
      Before any action that submits, approves, pays, signs, or sends something on
      the user's behalf, such as on a web page where the user is signed in,
      describe the action and ask the user to confirm it.
      Answer in the language of the user's request.

# ── the audit preset and the Creator preset ─────────────────────────────────

- id: preset-standard
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: agent-preset-registry
  config:
    default: audit

# The persona text matches the dsh-audit-agent root persona.
- insert:
    - id: preset-audit
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: audit
        name: 审计模式
        description: 审计：执行命令、联网搜索、读取和检索文件，使用审计插件包的工具和技能，只能在当前工作目录中写入底稿和报告。
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are 八局审计智能体 (CSCEC8B Audit Agent), an audit assistant powered by
                the {{model}} model. You help auditors examine documents, spreadsheets,
                data, systems, and code against the criteria that apply to them. Work from
                evidence: inspect the material yourself with the available tools, cite the
                exact location behind every finding, and state plainly when evidence is
                missing or a conclusion is uncertain. Never change the material under
                review: report the corrections you would make instead. Save working papers
                and reports as new files in the workspace when the user asks for a file.
                Before any action that submits, approves, pays, signs, or sends something on
                the user's behalf, such as on a web page where the user is signed in,
                describe the action and ask the user to confirm it.
                Answer in the language of the user's request.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # Skills come only from the bundled audit catalog, never from
          # project or user skill directories.
          - id: audit-skills
            name: '@deepseek-ai/dsh-audit-skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                # The longest audit plugin pack SKILL.md is about 33,000 characters.
                config:
                  thresholdChars: 40000
                  headChars: 20000
                  tailChars: 8000
          # The audit plugin pack skills dispatch their named roles to spawned
          # subagents and run workflows; children inherit this preset.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # The MCP servers and skills of the audit-plugins release unpacked at
          # $DSH_HOME/audit-plugins; without that directory the row mounts nothing.
          - id: audit-plugin-pack
            name: '@deepseek-ai/dsh-audit-plugin-pack'

# ── the Sidebar browser for the agent ───────────────────────────────────────

# Desktop serves a loopback CDP endpoint over the Sidebar browser tabs and
# names it in DSH_DESKTOP_BROWSER_CDP_ENDPOINT; `{sessionId}` gives each
# Session its own endpoint, which exposes only that Session's Sidebar tabs.
# Outside Desktop the variable is absent and both rows stay off.
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
      disabled: !!js process.env.DSH_DESKTOP_BROWSER_CDP_ENDPOINT === undefined
    - id: browser-use-playwright-mcp
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      disabled: !!js process.env.DSH_DESKTOP_BROWSER_CDP_ENDPOINT === undefined
      config:
        mode: attach
        endpoint: !!js process.env.DSH_DESKTOP_BROWSER_CDP_ENDPOINT

# ── preset and plugin authoring ─────────────────────────────────────────────

# dsh-audit-org-defaults switches off the Host plugin manager; the Creator
# preset persists plugins and profile changes through it.
- id: plugin-manager
  disabled: false

# Model context describing the DeepSeek Harness checkout and GUI; it would add
# the checkout and GUI address to audit sessions too.
- id: harness-dev-context
  disabled: true

# ── no DeepSeek account or product analytics ────────────────────────────────

- id: ui-settings-account
  disabled: true

- id: account-controller
  disabled: true

- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# ── CSCEC8B brand ────────────────────────────────────────────────────────────

# The seal and 八局审计智能体 replace the official sidebar artwork and the home whale.
- id: ui-brand-official
  disabled: true

# The Plugin list in Settings keeps entry ids, titles, and descriptions, but
# not the internal `@deepseek-ai/dsh-*` package names behind them.
- id: ui-settings-plugin-inventory
  config:
    showModuleName: false

- insert:
    - id: ui-brand-cscec8b
      name: '@deepseek-ai/dsh-client-ui-brand-cscec8b'

# ── audit workbench ─────────────────────────────────────────────────────────

# The 审计工作台 sidebar page: the Host row reads the audit plugin pack's
# workbench manifest, the project archive of every workspace, and each
# system's login status; the browser row shows them and fills new sessions.
- insert:
    - id: audit-workbench
      name: '@deepseek-ai/dsh-audit-workbench'
    - id: ui-audit-workbench
      name: '@deepseek-ai/dsh-client-ui-audit-workbench'
