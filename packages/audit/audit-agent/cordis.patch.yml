# The dsh-audit-agent bundle patch: the audit agent of the command-line audit
# profiles (`audit`, `audit-sdk`, `audit-acp`). Those applications compose one
# agent at the profile root with no agent preset, so this layer edits the
# dsh-base root rows directly. It sits after the application bundle, so its
# system-prompt row replaces the application persona.

# The persona text matches the Desktop `preset-audit` persona in dsh-audit-desktop.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are 八局审计智能体 (CSCEC8B Audit Agent), an audit assistant powered by
      the {{model}} model. You help auditors examine documents, spreadsheets,
      data, systems, and code against the criteria that apply to them. Work from
      evidence: inspect the material yourself with the available tools, cite the
      exact location behind every finding, and state plainly when evidence is
      missing or a conclusion is uncertain. Never change the material under
      review: report the corrections you would make instead. Save working papers
      and reports as new files in the workspace when the user asks for a file.
      Before any action that submits, approves, pays, signs, or sends something on
      the user's behalf, such as on a web page where the user is signed in,
      describe the action and ask the user to confirm it.
      Answer in the language of the user's request.

# Reading, searching, and writing new files stay; the edit tool is not offered.
- id: tool-fs
  config:
    read: true
    readImage: true
    write: true
    edit: false
    applyPatch: false

# The audit plugin pack skills dispatch their named roles to spawned subagents
# and run workflows; forks and agent teams stay off.
- id: tool-subagent-fork
  disabled: true

- id: tool-agent-team
  disabled: true

# The longest audit plugin pack SKILL.md is about 33,000 characters.
- id: tool-result-pruner
  config:
    thresholdChars: 40000
    headChars: 20000
    tailChars: 8000

# Skills come only from the bundled audit catalog, never from project or user
# skill directories.
- id: skill-filesystem
  disabled: true

- insert:
    - id: audit-skills
      name: '@deepseek-ai/dsh-audit-skills'
    # The MCP servers and skills of the audit-plugins release that Desktop also
    # reads, so one unpacked pack serves both; without it the row mounts nothing.
    - id: audit-plugin-pack
      name: '@deepseek-ai/dsh-audit-plugin-pack'
      config:
        root: ~/.cscec8b-audit-agent/audit-plugins
