# The dsh-audit-org-defaults bundle patch: deployment defaults shared by every
# audit profile. Every row it addresses is a dsh-base row, so the layer applies
# unchanged over the headless, SDK, ACP, and Web application bundles. It sits
# after the application bundle in each audit profile template.

# ── no DeepSeek account ─────────────────────────────────────────────────────

# The account platform and its model route. Without the route the model picker
# offers no "DeepSeek Account" entry that can only ask for a sign-in.
- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

# ── no telemetry export ─────────────────────────────────────────────────────

- id: session-telemetry-otel
  disabled: true

# Request extensions that send the session log (`dsh_session_log`) and the
# loaded plugin package list (`dsh_plugin_packages`) with each official
# DeepSeek API request. The model request itself is unchanged.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# ── no runtime self-modification ────────────────────────────────────────────

# Plugin installation and the model-facing plugin tools. The config editor
# stays: the settings service requires it.
- id: plugin-manager
  disabled: true

- id: tool-plugin-manager
  disabled: true

# ── writes only inside the workspace by default ─────────────────────────────

# By default, confined processes may write only inside the session workspace
# and their private temporary directory. The literal mode replaces the
# DSH_PERMISSION_MODE lookup in dsh-base and dsh-headless, and dropping
# additionalWritableRoots makes `--add-dir` grant nothing.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

# `never` rejects every approval request without asking: a command denied in
# the workspace-write preset is not retried in a wider sandbox through an
# approval; the person switches to full access instead.
- id: approval
  config:
    policy: never

# The presets a session, `--permission-mode`, or the permission menu can
# select. Fresh sessions start in workspace-write; the Desktop client asks for
# an explicit risk confirmation before it selects full access.
- id: permission
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: workspace-write
        description: Run commands, read files, and write only inside the workspace; wider access is refused.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: danger-full-access
        description: Run commands and read and write files anywhere the account can, without confirmation.
    defaultPreset: workspace-write
